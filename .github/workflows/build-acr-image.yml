name: Build ACR image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - pyproject.toml
      - src/**
      - scripts/**
      - profiles/**
      - site/scripts/**
      - .github/workflows/build-acr-image.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tags
        id: meta
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ai-news-agent:dev-${{ steps.meta.outputs.short }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/ai-news-agent:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
